name: GurbaniCaptioning
options:
  bundleIdPrefix: com.sangat
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  GurbaniCaptioningPackage:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  GurbaniCaptioningApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/GurbaniCaptioningApp
        excludes:
          - "Info.plist"
    info:
      path: Sources/GurbaniCaptioningApp/Info.plist
      properties:
        CFBundleDisplayName: Sangat
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Sangat listens to live kirtan to caption the lines being sung."
    dependencies:
      - package: GurbaniCaptioningPackage
        product: SangatApp
      - package: GurbaniCaptioningPackage
        product: GurbaniCaptioning
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sangat.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Sangat listens to live kirtan to caption the lines being sung."
        GENERATE_INFOPLIST_FILE: NO
